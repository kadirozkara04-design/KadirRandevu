<!DOCTYPE html>
<html lang="tr">
<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<nav class="navbar">

                width="auto"

                autoplay
                muted
                loop
                disablepictureinpicture
                id="logo"

                    src="{{ url_for('static', filename='videos/kystresmi-00.webm') }}"

        <button class="mobile-menu-btn" type="button">
