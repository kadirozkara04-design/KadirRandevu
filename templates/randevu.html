<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Randevu Oluştur | Kadir Yazılım</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="appointment-page">

        <div class="appointment-header">

            <span>🗓️ KADİR YAZILIM</span>

            <h1>Randevunuzu Oluşturun</h1>

            <p>
                Proje, teknik destek ve iş birliği görüşmeniz için
                uygun bir zaman seçin.
            </p>

        </div>


        <form class="appointment-form" method="POST" action="/randevu">

            <div class="form-group">

                <label for="name">
                    Ad Soyad
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Adınızı ve soyadınızı girin"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-posta
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ornek@mail.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Telefon
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="05XX XXX XX XX"
                    required
                >

            </div>


            <div class="form-group">

                <label for="service">
                    Görüşme Konusu
                </label>

                <select
                    id="service"
                    name="service"
                    required
                >

                    <option value="">
                        Seçiniz
                    </option>

                    <option value="web">
                        Web Sitesi
                    </option>

                    <option value="mobile">
                        Mobil Uygulama
                    </option>

                    <option value="support">
                        Teknik Destek
                    </option>

                    <option value="ai">
                        Yapay Zekâ / Otomasyon
                    </option>

                    <option value="business">
                        İş Birliği
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="appointment-btn"
            >
                🗓️ Randevu Oluştur
            </button>


        </form>

    </div>

</body>

</html>
